# fly.toml app configuration file generated for maghreb-rayonnage-app on 2026-07-24T16:40:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maghreb-rayonnage-app'
primary_region = 'iad'

[build]
  dockerfile = 'server/Dockerfile'
  ignorefile = 'server/Dockerfile.dockerignore'

[env]
  NODE_ENV = 'production'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
