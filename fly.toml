# Fly.io configuration for the backend API (Express + PostgreSQL).
# The frontend (Vite/React) is deployed separately to Vercel and is not part of this app.
#
# First-time setup:
#   fly launch --no-deploy   (or `fly apps create maghreb-rayonnage-api` to just reserve the name)
#   fly secrets set ANTHROPIC_API_KEY=... DATABASE_URL=...
#   fly deploy

app = "maghreb-rayonnage-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"
  ignorefile = "server/Dockerfile.dockerignore"

[env]
  NODE_ENV = "production"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
